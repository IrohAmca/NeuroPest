[project]
name = "neuropest"
version = "0.1.0"
description = "Desktop fly pet driven by a FlyWire-based reduced neural circuit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=15",
    "numba>=0.68.0",
]

[project.scripts]
neuropest = "neuropest.app:main"

[project.optional-dependencies]
gpu = [
    "wgpu>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuropest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
