[project]
name = "neuropest"
version = "0.5.2"
description = "Desktop fly pet driven by a FlyWire-based reduced neural circuit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "IrohAmca", email = "aliaygun365@gmail.com" }
]
keywords = [
    "drosophila",
    "connectome",
    "flywire",
    "neuroscience",
    "spiking-neural-networks",
    "lif-simulation",
    "desktop-pet",
    "reinforcement-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.68.0",
    "wgpu>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/IrohAmca/NeuroPest"
Repository = "https://github.com/IrohAmca/NeuroPest"
Issues = "https://github.com/IrohAmca/NeuroPest/issues"

[project.scripts]
neuropest = "neuropest.app:main"
neuropest-download = "neuropest.data_manager:main"

[project.optional-dependencies]
gpu = [
    "wgpu>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuropest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
# only tools/build_flywire.py (and the tests that build a tiny dataset) read parquet; the running app never does.
# Installed by default (see default-groups); `uv sync --no-group build` leaves them out.
build = [
    "pandas>=2.0",
    "pyarrow>=15",
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled flexibly in scientific code
    "E402",  # module level import not at top of file (used for delayed Qt/Numba imports)
    "E741",  # ambiguous variable name in mathematical matrices
    "F401",  # imported but unused
]
